services:
  - type: web
    name: resqagent-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://localhost:5173,http://localhost:8000,http://127.0.0.1:8000
      - key: FRONTEND_URL
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        value: admin@resqagent.org
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
